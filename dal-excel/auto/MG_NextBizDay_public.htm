<h1>NextBizDay (in Excel: DA.NEXTBUS)</h1>
Find the next business day on or after the given date

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>center</td><td>string</td><td></td><td>Holiday center name (e.g. "BEY" for Beijing, empty string for no holidays)</td></tr>
<tr><td>date</td><td>date</td><td></td><td>The starting date</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>result</td><td>date</td><td>The next business day</td></tr>
</table>
