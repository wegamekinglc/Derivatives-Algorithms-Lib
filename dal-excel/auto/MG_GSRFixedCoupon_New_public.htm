<h1>GSRFixedCoupon_New (in Excel: GSRFIXEDCOUPON.NEW)</h1>
Create one fixed swap coupon

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>payment</td><td>date</td><td></td><td>Payment date</td></tr>
<tr><td>accrual</td><td>number</td><td></td><td>Coupon accrual fraction</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>coupon</td><td>handle of type StorableGSRFixedCoupon</td><td>Coupon handle</td></tr>
</table>
