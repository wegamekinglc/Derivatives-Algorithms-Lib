<h1>PeriodLengthNew (in Excel: DA.PERIODLENGTHNEW)</h1>
Create a period length handle from an ISO string

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>iso</td><td>string</td><td></td><td>The ISO period string (e.g. "3M", "6M", "12M")</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>period</td><td>handle of type StorablePeriodLength</td><td>The period length</td></tr>
</table>
