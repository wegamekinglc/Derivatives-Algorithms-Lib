<h1>Init_GlobalData (in Excel: INIT.GLOBALDATA)</h1>
Initialize the DAL global environment (thread pool, repository, etc.)

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>nThreads</td><td>integer</td><td></td><td>number of threads (0 = auto-detect, default)</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>ok</td><td>boolean</td><td>true if initialization succeeded</td></tr>
</table>
