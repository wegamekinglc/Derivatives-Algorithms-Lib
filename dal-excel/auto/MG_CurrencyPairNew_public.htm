<h1>CurrencyPairNew (in Excel: DA.CURRENCYPAIRNEW)</h1>
Create a currency pair handle

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>domestic</td><td>string</td><td></td><td>Domestic currency code (e.g. "USD")</td></tr>
<tr><td>foreign</td><td>string</td><td></td><td>Foreign currency code (e.g. "EUR")</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>pair</td><td>handle of type StorableCurrencyPair</td><td>The currency pair</td></tr>
</table>
