<h1>DayBasis_New (in Excel: DAYBASIS.NEW)</h1>
Create a day basis handle from a name string

<h2>Inputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th>Optional?</th><th></th></tr>

<tr><td>name</td><td>string</td><td></td><td>The day basis name (e.g. "ACT_365F", "ACT_360", "30_360")</td></tr>

</table>





<h2>Outputs:</h2>
<table border="1" cellpadding="3">
<tr><th>Name</th><th style="width:120px">Type</th><th></th></tr>

<tr><td>basis</td><td>handle of type StorableDayBasis</td><td>The day basis</td></tr>
</table>
