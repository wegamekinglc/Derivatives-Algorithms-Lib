[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dal-web-backend"
version = "0.1.0"
description = "FastAPI backend for DAL derivatives portfolio management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx2>=2.0",
    "ruff>=0.6",
]

# uv-native development dependency group. `uv sync` installs these by default;
# the optional-dependencies block above is kept for plain `pip install .[dev]`.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx2>=2.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not native'"
markers = [
    "native: requires the compiled DAL extension and runs no fake-DAL substitute",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
# B008: FastAPI's ``Depends(...)`` / ``Body(...)`` defaults are idiomatic and
# unavoidable in router signatures.
ignore = ["E501", "B008"]
