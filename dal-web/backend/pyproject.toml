[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dal-web-backend"
version = "0.1.0"
description = "FastAPI backend for DAL derivatives portfolio management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
]

# uv-native development dependency group. `uv sync` installs these by default;
# the optional-dependencies block above is kept for plain `pip install .[dev]`.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
