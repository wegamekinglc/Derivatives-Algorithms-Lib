name: Scheduled Benchmarks
on:
  schedule:
    - cron: '0 6,18 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: Scheduled suite or the fixed DAL-469 diagnostic
        type: choice
        required: true
        default: scheduled
        options:
          - scheduled
          - dal-469

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dal-469' && format('dal-469-diagnostic-{0}', github.ref) || 'scheduled-benchmarks' }}
  cancel-in-progress: false

jobs:
  # Paired Linux measurements run outside pull-request and push CI.
  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'scheduled' }}
    name: Linux benchmarks
    runs-on: ubuntu-latest
    # No ccache here: this job builds with -march=native, and cached objects
    # restored on a different runner CPU generation crash with SIGILL.
    env:
      # Bare Make -j is unbounded; keep compiler memory within hosted-runner limits.
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The previous master commit is the scheduled comparison baseline.
          fetch-depth: 2

      - name: Check out pinned dependencies
        run: python .github/scripts/checkout_dependencies.py

      - name: Resolve benchmark base SHA
        run: echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: benchmark-base

      - name: Check out pinned benchmark baseline dependencies
        run: python .github/scripts/checkout_dependencies.py --worktree benchmark-base

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake time \
            libc++-dev autotools-dev autoconf libtool

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # @v10.3.2

      - name: Set up benchmark Python
        run: |
          export VIRTUAL_ENV="$PWD/dal-python/.venv"
          uv venv "$VIRTUAL_ENV" --python 3.13
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          uv pip install pytest numpy

      - name: Capture benchmark environment
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
        run: |
          resolved_base="$BASE_SHA"
          if [ -d benchmark-base ]; then
            resolved_base="$(git -C benchmark-base rev-parse HEAD)"
          fi
          python3 .github/scripts/write_benchmark_metadata.py \
            --output benchmark-results/environment.json \
            --head-sha "$(git rev-parse HEAD)" \
            --base-sha "$resolved_base" \
            --compiler gcc-14 \
            --aad-backend aadet \
            --threads 4 \
            --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}"

      - name: Test benchmark regression gate
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v

      - name: Prepare historical benchmark timing check
        run: |
          python3 .github/scripts/prepare_benchmark_baseline.py \
            --source-root benchmark-base \
            --evidence-dir benchmark-results/baseline-timing-adjustment

      - name: Build head benchmarks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          # See the base build step for why this flag is here: it is a no-op
          # on the head (the mapped prefix does not occur in head sources) but
          # keeps CMAKE_CXX_FLAGS textually identical between the two builds.
          cmake -S . -B build/benchmark-head \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_PUBLIC_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=ON \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DCMAKE_CXX_FLAGS=-ffile-prefix-map=$PWD/benchmark-base=$PWD \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build build/benchmark-head --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Build base benchmarks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          # The base tree is checked out one directory deeper than the head
          # tree, so __FILE__-embedded absolute paths differ by ~15 chars
          # between the two builds, skewing codegen layout on fast
          # sub-millisecond benchmark cases. Map the base prefix onto the
          # head's so both binaries embed identical paths; the same flag text
          # is passed to the head build (a harmless no-op there) to keep the
          # gate's CMAKE_CXX_FLAGS equality check satisfied.
          cmake -S benchmark-base -B benchmark-base/build/benchmark-base \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_PUBLIC_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=ON \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DCMAKE_CXX_FLAGS=-ffile-prefix-map=$PWD/benchmark-base=$PWD \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build benchmark-base/build/benchmark-base --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Verify Python workloads on both native builds
        id: python-workloads
        env:
          DAL_NUM_THREADS: 4
        run: |
          verify_python_build() {
            local source_root="$1"
            local build_root="$2"
            (
              cd "$build_root/dal-python"
              if [ "$source_root" = "$GITHUB_WORKSPACE/benchmark-base" ]; then
                # Historical suite failures are diagnostic; shared benchmark correctness still gates both builds.
                local evidence="$GITHUB_WORKSPACE/benchmark-results/python-baseline-tests"
                local status
                mkdir -p "$evidence"
                if PYTHONPATH="$build_root/dal-python" python3 -m pytest "$source_root/dal-python/tests" -q > "$evidence/output.txt" 2>&1; then
                  status=0
                else
                  status=$?
                fi
                echo "$status" > "$evidence/status.txt"
                cat "$evidence/output.txt"
                if [ "$status" -ne 0 ]; then
                  echo "::warning::Historical baseline Python suite failed (exit $status); see retained evidence. Shared benchmark tests remain required."
                fi
              else
                PYTHONPATH="$build_root/dal-python" python3 -m pytest "$source_root/dal-python/tests" -q
              fi
              # Both native revisions must still satisfy the same head workloads.
              PYTHONPATH="$build_root/dal-python" python3 -m pytest "$GITHUB_WORKSPACE/dal-python/tests/test_benchmarks.py" -q
            )
          }
          verify_python_build "$GITHUB_WORKSPACE/benchmark-base" "$GITHUB_WORKSPACE/benchmark-base/build/benchmark-base"
          verify_python_build "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/benchmark-head"

      - name: Run head benchmarks
        env:
          DAL_NUM_THREADS: 4
          DAL_JOINT_QUOTE_RISK_BENCHMARK_FILE: ${{ github.workspace }}/benchmark-results/generic-joint-raw-v1.csv
        run: |
          python3 .github/scripts/run_benchmarks.py \
            --build-root build/benchmark-head \
            --results-dir benchmark-results \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --configuration "gcc-14, native CPU tuning, AADet backend, Release." \
            --resource-usage

      - name: Compare base and head Python performance
        id: python-performance
        if: ${{ !cancelled() && steps.python-workloads.outcome == 'success' }}
        env:
          DAL_NUM_THREADS: 4
        run: |
          # The full inventory includes 32/256-IRS native AAD node-DV01 workloads.
          python3 .github/scripts/check_python_benchmark_regressions.py \
            --base-source benchmark-base \
            --head-source . \
            --base-root benchmark-base/build/benchmark-base \
            --head-root build/benchmark-head \
            --output-dir benchmark-results/python-paired \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 \
            --confirmation-rounds 2 \
            --threshold-percent 4

      - name: Install Python comparison dependencies
        id: python-comparison-dependencies
        if: ${{ !cancelled() && steps.python-workloads.outcome == 'success' }}
        run: |
          uv pip install --require-hashes \
            -r dal-python/benchmarks/requirements-comparisons.txt

      - name: Set up InFine .NET SDK
        id: infine-sdk
        if: ${{ !cancelled() && steps.python-comparison-dependencies.outcome == 'success' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # @v6.0.0
        with:
          dotnet-version: '8.0.426'

      - name: Check out pinned InFine source
        id: infine-source
        if: ${{ !cancelled() && steps.python-comparison-dependencies.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: infineco/quant-finance-library
          ref: 514ffe83b9ef8be0a29578c6f190b390267facf7
          path: benchmark-infine-source
          persist-credentials: false

      - name: Build pinned InFine comparison worker
        id: infine-build
        if: ${{ !cancelled() && steps.infine-sdk.outcome == 'success' && steps.infine-source.outcome == 'success' }}
        run: |
          python3 dal-python/benchmarks/prepare_infine.py \
            --source benchmark-infine-source \
            --output benchmark-results/infine-build

      - name: Check out pinned QuantLib source
        id: quantlib-source
        if: ${{ !cancelled() && steps.python-comparison-dependencies.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lballabio/QuantLib
          ref: 6b57206e04598f092efee66e3b367efc84771995
          path: benchmark-results/quantlib-source
          persist-credentials: false

      - name: Build native QuantLib and DAL comparison workers
        id: native-workers
        if: ${{ !cancelled() && steps.infine-build.outcome == 'success' && steps.quantlib-source.outcome == 'success' }}
        run: |
          mkdir -p benchmark-results/tools/boost-deb benchmark-results/tools/boost
          (cd benchmark-results/tools/boost-deb && apt-get download libboost1.83-dev)
          dpkg-deb -x benchmark-results/tools/boost-deb/*.deb benchmark-results/tools/boost
          cmake -S benchmark-results/quantlib-source -B benchmark-results/quantlib-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DQL_BUILD_EXAMPLES=OFF -DQL_BUILD_TEST_SUITE=OFF \
            -DQL_INSTALL_BENCHMARK=OFF -DQL_INSTALL_EXAMPLES=OFF \
            -DQL_INSTALL_TEST_SUITE=OFF \
            -DBoost_NO_BOOST_CMAKE=ON -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_ROOT="$PWD/benchmark-results/tools/boost/usr" \
            -DCMAKE_INSTALL_PREFIX="$PWD/benchmark-results/quantlib-install"
          cmake --build benchmark-results/quantlib-build --target install --parallel 4
          cmake --preset=Release-linux -S . -B build/Release-native-queries \
            -DDAL_CPP_BUILD_BENCHMARKS=ON -DDAL_CPP_BUILD_NATIVE_COMPARISONS=ON \
            -DQuantLib_DIR="$PWD/benchmark-results/quantlib-install/lib/cmake/QuantLib" \
            -DDAL_BUILD_PUBLIC=OFF -DDAL_BUILD_PYTHON=OFF -DDAL_BUILD_EXCEL=OFF \
            -DDAL_BUILD_EXCEL_PORTABLE_TESTS=OFF
          cmake --build build/Release-native-queries \
            --target native_query_comparison --parallel 4

      - name: Compare Python APIs and native curve suite
        if: ${{ !cancelled() && steps.native-workers.outcome == 'success' }}
        env:
          DAL_NUM_THREADS: 4
          MPLCONFIGDIR: ${{ runner.temp }}/dal-comparison-matplotlib
          DAL_INFINE_BUILD: ${{ github.workspace }}/benchmark-results/infine-build
          DAL_NATIVE_QUERY_WORKER: ${{ github.workspace }}/build/Release-native-queries/dal-cpp/benchmarks/native_query_comparison/native_query_comparison
        run: |
          PYTHONPATH="$PWD/build/benchmark-head/dal-python" \
            python3 -m pytest dal-python/benchmarks/tests -q
          python3 dal-python/benchmarks/run_comparisons.py \
            --dal-package build/benchmark-head/dal-python \
            --output-dir benchmark-results/python-third-party \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 \
            --rounds 2
          python3 dal-python/benchmarks/run_native_queries.py \
            --native-worker "$DAL_NATIVE_QUERY_WORKER" \
            --native-build-root build/Release-native-queries \
            --quantlib-build-root benchmark-results/quantlib-build \
            --quantlib-source benchmark-results/quantlib-source \
            --infine-build "$DAL_INFINE_BUILD" \
            --output-dir benchmark-results/native-curve-suite \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --case discount_queries \
            --case calibration_single_5 \
            --case calibration_single_15 \
            --case calibration_multi_staged_5 \
            --case calibration_multi_staged_15 \
            --samples 10 --rounds 2

      - name: Compare base and head performance
        if: ${{ !cancelled() && steps.python-workloads.outcome == 'success' }}
        env:
          DAL_NUM_THREADS: 4
        run: |
          python3 .github/scripts/check_benchmark_regressions.py \
            --base-root benchmark-base/build/benchmark-base \
            --head-root build/benchmark-head \
            --output-dir benchmark-results/paired \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 \
            --confirmation-rounds 2 \
            --threshold-percent 4 \
            --retry-identical-binaries

      - name: Diagnose Python regression with baseline A/A
        if: ${{ !cancelled() && steps.python-performance.outcome == 'failure' }}
        env:
          DAL_NUM_THREADS: 4
        run: |
          # Diagnostics never replace the original base/head verdict. Run them
          # after all comparisons so their workloads do not precede gated timings.
          # Keep the gate's distinct-root check: the control is an explicit copy
          # of this binary and its configuration, not an independent rebuild.
          mkdir -p benchmark-baseline-aa/dal-python
          cp benchmark-base/build/benchmark-base/CMakeCache.txt benchmark-baseline-aa/
          cp -a benchmark-base/build/benchmark-base/dal-python/dal benchmark-baseline-aa/dal-python/
          python3 .github/scripts/check_python_benchmark_regressions.py \
            --base-source benchmark-base --head-source benchmark-base \
            --base-root benchmark-base/build/benchmark-base \
            --head-root benchmark-baseline-aa \
            --output-dir benchmark-results/python-baseline-aa \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 --confirmation-rounds 2 --threshold-percent 4

      - name: Diagnose Python regression with head A/A
        if: ${{ !cancelled() && steps.python-performance.outcome == 'failure' }}
        env:
          DAL_NUM_THREADS: 4
        run: |
          mkdir -p benchmark-head-aa/dal-python
          cp build/benchmark-head/CMakeCache.txt benchmark-head-aa/
          cp -a build/benchmark-head/dal-python/dal benchmark-head-aa/dal-python/
          python3 .github/scripts/check_python_benchmark_regressions.py \
            --base-source . --head-source . \
            --base-root build/benchmark-head --head-root benchmark-head-aa \
            --output-dir benchmark-results/python-head-aa \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 --confirmation-rounds 2 --threshold-percent 4

      - name: Preserve Python binaries after a regression
        if: ${{ !cancelled() && steps.python-performance.outcome == 'failure' }}
        run: |
          mkdir -p benchmark-results/python-reproduction
          tar -C benchmark-base/build/benchmark-base/dal-python \
            -czf benchmark-results/python-reproduction/base-package.tar.gz dal
          tar -C build/benchmark-head/dal-python \
            -czf benchmark-results/python-reproduction/head-package.tar.gz dal

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 30

  # Representative MSVC/AADet run, independent of the Windows CI gate.
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'scheduled' }}
    name: Windows benchmarks
    runs-on: windows-latest
    # Keep the benchmark build independent of the CI compiler cache.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Check out pinned dependencies
        run: python .github/scripts/checkout_dependencies.py

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with C++ build tools was not found"
          }
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }
          $varsToExport = @(
            "Path", "PATH", "INCLUDE", "LIB", "LIBPATH",
            "UniversalCRTSdkDir", "UCRTVersion", "VCINSTALLDIR",
            "VCToolsInstallDir", "VSINSTALLDIR", "WindowsSdkDir", "WindowsSDKVersion"
          )
          cmd /c "`"$vsDevCmd`" -host_arch=x64 -arch=x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              if ($varsToExport -contains $name) {
                "$name=$($matches[2])" >> $env:GITHUB_ENV
              }
            }
          }

      - name: Capture benchmark environment
        shell: bash
        run: |
          python3 .github/scripts/write_benchmark_metadata.py \
            --output benchmark-results/environment.json \
            --head-sha "$(git rev-parse HEAD)" \
            --base-sha "$(git rev-parse HEAD^1)" \
            --compiler cl \
            --aad-backend aadet \
            --threads 4 \
            --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}"

      - name: Build Machinist
        shell: bash
        run: |
          cd dal-cpp/externals/machinist
          rm -rf build
          mkdir -p build
          cd build
          cmake --preset Release-windows ..
          cmake --build .
          cmake --install .

      - name: Run code generation
        shell: bash
        run: |
          export MACHINIST_TEMPLATE_DIR="$(pwd -W)/dal-cpp/externals/machinist/template/"
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-cpp/dal
          cmake -DDAL_REPOSITORY_ROOT="$PWD" -P dal-cpp/cmake/normalize-calibration-generated-enums.cmake
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-excel

      - name: Compile
        shell: bash
        env:
          CC: cl
          CXX: cl
        run: |
          rm -rf build/Release-windows build/stage/Release-windows
          cmake --preset Release-windows -DDAL_BUILD_PUBLIC=ON -DDAL_CPP_BUILD_EXAMPLES=ON \
            -DDAL_BUILD_PYTHON=OFF -DDAL_CPP_BUILD_BENCHMARKS=ON -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build build/Release-windows --parallel
          cmake --install build/Release-windows

      - name: Run benchmarks
        shell: bash
        run: |
          python3 .github/scripts/run_benchmarks.py \
            --build-root build/Release-windows \
            --results-dir benchmark-results \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --configuration "msvc, native/AADet backend."

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 30

  diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dal-469' }}
    name: DAL-469 fixed-comparison diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      DAL469_MODE: ${{ inputs.mode }}
      DAL_NUM_THREADS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out original head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d7eaefb7808ba32aecc870b7babc7cc9e7fc650a
          path: diagnostic-workspace
      - name: Check out original base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72b3d15e04a9a42859b3f3b264b0f4ea635ddb20
          path: diagnostic-workspace/benchmark-base

      - name: Set up diagnostic toolchain
        run: |
          python3 .github/scripts/setup_dal469_toolchain.py
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # @v10.3.2
      - name: Set up diagnostic Python and CMake
        run: |
          uv venv .diagnostic-venv --python 3.13.17
          export VIRTUAL_ENV="$PWD/.diagnostic-venv"
          uv pip install cmake==3.31.6 pytest numpy
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Check out diagnostic dependencies
        run: |
          python3 .github/scripts/checkout_dependencies.py --worktree diagnostic-workspace
          python3 .github/scripts/checkout_dependencies.py --worktree diagnostic-workspace/benchmark-base
      - name: Fetch original diagnostic binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download 40411137529 --name benchmark-linux-40411137529-1 --dir "$RUNNER_TEMP/dal469-original" > diagnostic-results/artifact-download.txt 2>&1; then
            echo 0 > diagnostic-results/artifact-download.status
          else
            echo "$?" > diagnostic-results/artifact-download.status
            echo '::warning::Original artifact unavailable; using same-runner paired rebuilds.'
          fi
      - name: Inspect diagnostic compatibility
        id: diagnostic-prepare
        run: python3 .github/scripts/diagnose_dal469.py prepare
      - name: Build only diagnostic targets
        env:
          CC: gcc-14
          CXX: g++-14
          DAL469_PYTHON_MODE: ${{ steps.diagnostic-prepare.outputs.python_mode }}
        run: |
          set -o pipefail
          head_source="$PWD/diagnostic-workspace"
          base_source="$head_source/benchmark-base"
          targets=(tape_perf)
          if [ "$DAL469_PYTHON_MODE" = rebuild ]; then
            targets+=(_dal)
          fi
          for side in head base; do
            source_root="$head_source"
            build_root="$head_source/build/benchmark-head"
            if [ "$side" = base ]; then
              source_root="$base_source"
              build_root="$base_source/build/benchmark-base"
            fi
            cmake -S "$source_root" -B "$build_root" \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DDAL_BUILD_PUBLIC=ON -DDAL_BUILD_PYTHON=ON \
              -DDAL_PUBLIC_BUILD_TESTS=OFF -DDAL_CPP_BUILD_TESTS=OFF \
              -DDAL_CPP_BUILD_EXAMPLES=OFF -DDAL_CPP_BUILD_BENCHMARKS=ON \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPython3_EXECUTABLE="$(command -v python3)" \
              "-DCMAKE_CXX_FLAGS=-ffile-prefix-map=$head_source=$PWD -ffile-prefix-map=$base_source=$PWD" \
              -DDAL_ENABLE_NATIVE_ARCH=ON 2>&1 | tee "diagnostic-results/$side-configure.txt"
            cmake --build "$build_root" --target "${targets[@]}" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" \
              2>&1 | tee "diagnostic-results/$side-build.txt"
          done
      - name: Measure fixed diagnostic comparison
        run: python3 .github/scripts/diagnose_dal469.py measure
      - name: Collect separate diagnostic profiles
        if: ${{ !cancelled() && steps.diagnostic-prepare.outcome == 'success' }}
        run: python3 .github/scripts/diagnose_dal469.py profile
      - name: Upload diagnostic evidence
        if: always()
