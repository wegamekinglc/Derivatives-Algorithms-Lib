name: dal-python wheel CI

on:
  pull_request:
    paths:
      - .github/scripts/check_dal_python_syntax.py
      - .github/scripts/check_docs.py
      - .github/scripts/tests/test_check_docs.py
      - .github/scripts/tests/test_python_helpers*.py
      - .github/scripts/tests/test_python_release.py
      - .github/scripts/tests/test_python_smoke.py
      - .github/scripts/tests/test_python_syntax.py
      - .github/workflows/dal-python-ci.yml
      - .github/scripts/checkout_dependencies.py
      - .github/workflows/dal-python-release.yml
      - dal-python/**
      - '!dal-python/**/*.md'
      - '!dal-python/**/*.mdx'
      - '!dal-python/**/*.rst'
      - CMakeLists.txt
      - CMakePresets.json
      - dal-cpp/**
      - '!dal-cpp/**/*.md'
      - '!dal-cpp/**/*.mdx'
      - '!dal-cpp/**/*.rst'
      - dal-public/**
      - '!dal-public/**/*.md'
      - '!dal-public/**/*.mdx'
      - '!dal-public/**/*.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Check Python 3.9 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # @v10.3.2

      - name: Check Python 3.9 syntax compatibility
        run: >-
          uv run --isolated --no-project --python 3.9 python
          .github/scripts/check_dal_python_syntax.py

  wheels:
    name: ${{ matrix.platform }} wheels
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-amd64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out pinned dependencies
        run: python .github/scripts/checkout_dependencies.py

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # @v10.3.2

      - name: Test executable PowerShell helper contracts
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: >-
          uv run --isolated --no-project --python 3.13 python
          .github/scripts/tests/test_python_helpers_powershell.py -v

      - name: Test POSIX helper contracts
        if: matrix.platform == 'linux-x86_64'
        run: >-
          uv run --isolated --no-project --python 3.13 python
          .github/scripts/tests/test_python_helpers.py -v

      - name: Build and test wheels
        uses: pypa/cibuildwheel@f11181315571b24e4a3c67f1a828532793f2df55 # v4.3.2
        with:
          package-dir: dal-python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp39-* cp314-*

      - name: Smoke test installed Python 3.9 wheel
        run: >-
          uv run --isolated --no-project --python 3.9 python
          dal-python/scripts/smoke_installed_wheel.py
          --wheelhouse "${{ github.workspace }}/wheelhouse"
          --environment "${{ runner.temp }}/dal-python-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
          --work-dir "${{ runner.temp }}/dal-python-smoke-work-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
          --exclude "${{ github.workspace }}"
          --exclude "${{ github.workspace }}/wheelhouse"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify:
    name: Verify wheel matrix and metadata
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Validate eight-wheel CI matrix
        run: >-
          python dal-python/scripts/verify_release.py
          --dist-dir wheelhouse --expected-python cp39,cp314
