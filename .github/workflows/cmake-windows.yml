name: CMake Windows CI
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc]
        aad-backend: [aadet, xad, adept]
        include:
          - compiler: msvc
            cc: cl
            cxx: cl

    steps:

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with C++ build tools was not found"
          }

          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }

          $varsToExport = @(
            "Path",
            "PATH",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "UniversalCRTSdkDir",
            "UCRTVersion",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VSINSTALLDIR",
            "WindowsSdkDir",
            "WindowsSDKVersion"
          )

          cmd /c "`"$vsDevCmd`" -host_arch=x64 -arch=x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              if ($varsToExport -contains $name) {
                "$name=$($matches[2])" >> $env:GITHUB_ENV
              }
            }
          }

      - name: Configure AAD backend
        shell: bash
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          # dal-python (SWIG bindings) and dal-excel (Windows-only COM add-in)
          # are built on every matrix combination — the matrix is small
          # (3 jobs) and the bindings are backend-agnostic.
          FLAGS="$FLAGS -DDAL_BUILD_PYTHON=ON -DDAL_BUILD_EXCEL=ON"
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Install SWIG
        shell: pwsh
        run: |
          # windows-latest runners ship with Python 3.x but not SWIG.
          choco install swig --no-progress --yes
          # choco installs to C:\ProgramData\chocolatey\bin which is on PATH
          swig -version

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@v3

      - name: Set up Python venv
        shell: pwsh
        run: |
          uv venv .venv --python 3.12
          # .venv\Scripts must precede the system Python on PATH so cmake
          # finds the venv's interpreter at configure time.
          $venvScripts = (Resolve-Path .\.venv\Scripts).Path
          Add-Content -Path $env:GITHUB_PATH -Value $venvScripts
          uv pip install pytest numpy

      - name: Build Machinist
        shell: bash
        run: |
          cd dal-cpp/externals/machinist
          rm -rf build
          mkdir -p build
          cd build
          cmake --preset Release-windows ..
          cmake --build .
          cmake --install .

      - name: Run code generation
        shell: bash
        run: |
          export MACHINIST_TEMPLATE_DIR="$(pwd -W)/dal-cpp/externals/machinist/template/"
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-cpp/dal
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-excel

      - name: Compile
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build
          mkdir -p build
          cd build
          cmake --preset Release-windows -DDAL_BUILD_PUBLIC=ON -DDAL_CPP_BUILD_EXAMPLES=ON ${ADDITIONAL_CMAKE_FLAGS} ..
          cmake --build .
          cmake --install .

      - name: Test
        shell: bash
        run: |
          cd build
          ctest --output-on-failure -C Release
