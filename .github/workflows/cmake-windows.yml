name: CMake Windows CI
on: [push, pull_request]

# Per-ref grouping: a new push cancels stale runs of the same ref only --
# distinct PRs (refs/pull/N/merge) never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc]
        aad-backend: [aadet, xad, adept]
        include:
          - compiler: msvc
            cc: cl
            cxx: cl

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      # Same key rule as cmake-linux.yml: the action adds only a "ccache-"
      # prefix plus timestamp, so the key carries OS and backend itself.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.aad-backend }}

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with C++ build tools was not found"
          }

          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }

          $varsToExport = @(
            "Path",
            "PATH",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "UniversalCRTSdkDir",
            "UCRTVersion",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VSINSTALLDIR",
            "WindowsSdkDir",
            "WindowsSDKVersion"
          )

          cmd /c "`"$vsDevCmd`" -host_arch=x64 -arch=x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              if ($varsToExport -contains $name) {
                "$name=$($matches[2])" >> $env:GITHUB_ENV
              }
            }
          }

      - name: Configure AAD backend
        shell: bash
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          # dal-python (pybind11 bindings) and dal-excel (Windows-only COM add-in)
          # are built on every matrix combination — the matrix is small
          # (3 jobs) and the bindings are backend-agnostic.
          FLAGS="$FLAGS -DDAL_BUILD_PYTHON=ON -DDAL_BUILD_EXCEL=ON"
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      # pybind11 is built from the dal-cpp/externals/pybind11 git submodule
      # (pinned to v2.11.1). actions/checkout already initialized it via
      # submodules: recursive — no system package or FetchContent needed.

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # @v10.0.1

      - name: Set up Python venv
        shell: pwsh
        run: |
          uv venv dal-python/.venv --python 3.12
          $venvScripts = (Resolve-Path .\dal-python\.venv\Scripts).Path
          $venvRoot = (Resolve-Path .\dal-python\.venv).Path
          $pythonExe = Join-Path $venvScripts "python.exe"
          # Add venv Scripts to PATH so subprocesses (including cmake's
          # FindPython3 on some platforms) pick up the venv's python.
          Add-Content -Path $env:GITHUB_PATH -Value $venvScripts
          # Also set Python3_EXECUTABLE explicitly because cmake's
          # FindPython3 on Windows prefers the registry / highest-version
          # interpreter over PATH order. Point it at the venv's python
          # so dal_python_pytest can find pytest.
          Add-Content -Path $env:GITHUB_ENV -Value "Python3_EXECUTABLE=$pythonExe"
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$venvRoot"
          $env:VIRTUAL_ENV = $venvRoot
          uv pip install pytest numpy

      - name: Build Machinist
        shell: bash
        run: |
          cd dal-cpp/externals/machinist
          rm -rf build
          mkdir -p build
          cd build
          cmake --preset Release-windows ..
          cmake --build .
          cmake --install .

      - name: Run code generation
        shell: bash
        run: |
          export MACHINIST_TEMPLATE_DIR="$(pwd -W)/dal-cpp/externals/machinist/template/"
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-cpp/dal
          cmake -DDAL_REPOSITORY_ROOT="$PWD" -P dal-cpp/cmake/normalize-calibration-generated-enums.cmake
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-excel

      - name: Compile
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          rm -rf build/Release-windows build/stage/Release-windows
          # DIAGNOSTIC BRANCH ONLY (dal-tester): dal-excel off to bypass the two
          # fix-round Windows regressions (dal_excel_tests LNK2019 x7, GTest
          # REQUIRED in subdirectory mode) that mask the pytest segfault under
          # investigation. Later -D wins over ADDITIONAL_CMAKE_FLAGS.
          cmake --preset Release-windows -DDAL_BUILD_PUBLIC=ON -DDAL_CPP_BUILD_EXAMPLES=ON ${ADDITIONAL_CMAKE_FLAGS} \
            -DDAL_BUILD_EXCEL=OFF -DDAL_BUILD_EXCEL_PORTABLE_TESTS=OFF \
            ${Python3_EXECUTABLE:+-DPython3_EXECUTABLE="$Python3_EXECUTABLE"}
          cmake --build build/Release-windows --parallel
          cmake --install build/Release-windows

      # DIAGNOSTIC BRANCH ONLY (dal-tester): capture a native stack for the
      # dal_python_pytest access violation under cdb before the normal ctest
      # step runs. Never merged; no product code is touched on this branch.
      - name: Diagnose rate-pricing pytest crash under cdb
        shell: pwsh
        run: |
          Write-Host "=== DIAG-CAPTURE-START ==="
          $root = $env:GITHUB_WORKSPACE
          $py = Join-Path $root 'dal-python\.venv\Scripts\python.exe'
          # dal_python_pytest runs with WORKING_DIRECTORY = the build-tree
          # dal-python dir, where the assembled dal/ package (with _dal.pyd)
          # lives; python -m pytest puts CWD on sys.path, so import dal works.
          $buildPkg = Join-Path $root 'build\Release-windows\dal-python'
          Set-Location $buildPkg
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) {
            Write-Host "cdb not found at $cdb; running plain pytest instead"
            & $py -X faulthandler -m pytest "$root\dal-python\tests\test_curve_pricing.py" -q --tb=short
            exit 0
          }
          & $cdb -g -G -lines -c 'sxe -c "kv50; !analyze -v; qd" av; g' `
            $py -X faulthandler -m pytest "$root\dal-python\tests\test_curve_pricing.py" -q --tb=short
          Write-Host "=== DIAG-CAPTURE-END (cdb exit $LASTEXITCODE) ==="
          exit 0

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build/Release-windows --output-on-failure --parallel -C Release

      - name: Test installed CMake consumer
        shell: pwsh
        run: |
          $consumerBuild = Join-Path $env:RUNNER_TEMP "dal-consumer-${{ matrix.aad-backend }}"
          cmake `
            "-DDAL_INSTALL_PREFIX=$PWD/build/stage/Release-windows" `
            "-DDAL_CONSUMER_BINARY_DIR=$consumerBuild" `
            -DDAL_GENERATOR=Ninja `
            -DDAL_BUILD_CONFIG=Release `
            -P tests/installed-consumer/run.cmake

      - name: Build standalone dal-python against installed DAL
        shell: pwsh
        run: |
          $stage = (Resolve-Path .\build\stage\Release-windows).Path
          $pythonBuild = Join-Path $env:RUNNER_TEMP "dal-python-${{ matrix.aad-backend }}"
          cmake -S dal-python -B $pythonBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DDAL_INSTALL_PREFIX=$stage" `
            "-DPython3_EXECUTABLE=$env:Python3_EXECUTABLE" `
            -DDAL_PYTHON_BUILD_TESTS=OFF
          cmake --build $pythonBuild --target _dal --parallel

  # Smoke-test the build_windows.bat entry point so it stops rotting. The
  # --configure-only mode exercises everything the script owns -- vswhere
  # discovery, the Machinist build plus code generation, and the CMake
  # configure -- without paying for a second full build; the matrix above
  # remains the proven direct-cmake path for compilation and tests.
  build-script:
    name: build_windows.bat (configure-only)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Run build_windows.bat --configure-only
        shell: cmd
        run: build_windows.bat --configure-only

  # Benchmark job: builds and runs all performance benchmarks on one
  # representative configuration (msvc, native/AADet backend).
  # Results appear in the CI logs and job summary; timings are not a pass/fail gate.
  benchmark:
    name: Benchmarks
    runs-on: windows-latest
    # No ccache here: this job builds with -march=native, and cached objects
    # restored on a different runner CPU generation crash with SIGILL.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with C++ build tools was not found"
          }
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat was not found at $vsDevCmd"
          }
          $varsToExport = @(
            "Path", "PATH", "INCLUDE", "LIB", "LIBPATH",
            "UniversalCRTSdkDir", "UCRTVersion", "VCINSTALLDIR",
            "VCToolsInstallDir", "VSINSTALLDIR", "WindowsSdkDir", "WindowsSDKVersion"
          )
          cmd /c "`"$vsDevCmd`" -host_arch=x64 -arch=x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              if ($varsToExport -contains $name) {
                "$name=$($matches[2])" >> $env:GITHUB_ENV
              }
            }
          }

      - name: Build Machinist
        shell: bash
        run: |
          cd dal-cpp/externals/machinist
          rm -rf build
          mkdir -p build
          cd build
          cmake --preset Release-windows ..
          cmake --build .
          cmake --install .

      - name: Run code generation
        shell: bash
        run: |
          export MACHINIST_TEMPLATE_DIR="$(pwd -W)/dal-cpp/externals/machinist/template/"
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-cpp/dal
          cmake -DDAL_REPOSITORY_ROOT="$PWD" -P dal-cpp/cmake/normalize-calibration-generated-enums.cmake
          ./dal-cpp/externals/machinist/bin/Machinist.exe -c dal-cpp/config/dal.ifc -l dal-cpp/config/dal.mgl -d ./dal-excel

      - name: Compile
        shell: bash
        env:
          CC: cl
          CXX: cl
        run: |
          rm -rf build/Release-windows build/stage/Release-windows
          cmake --preset Release-windows -DDAL_BUILD_PUBLIC=ON -DDAL_CPP_BUILD_EXAMPLES=ON \
            -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off \
            -DDAL_BUILD_PYTHON=OFF -DDAL_CPP_BUILD_BENCHMARKS=ON -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build build/Release-windows --parallel
          cmake --install build/Release-windows

      - name: Run benchmarks
        shell: bash
        run: |
          # Single-source benchmark list via CTest labels (H8 fix, same as cmake-linux.yml)
          # ctest -N right-justifies the test-number field ("  Test  #1:" .. "  Test #10:"), so tolerate the padding
          benchmarks=( $(ctest -N -L benchmark --test-dir build/Release-windows | awk -F': ' '/Test +#/{print $2}') )
          if [ ${#benchmarks[@]} -eq 0 ]; then
            echo "benchmark discovery failed: ctest -N -L benchmark --test-dir build/Release-windows found no tests"
            exit 1
          fi

          mkdir -p benchmark-results
          {
            echo "## Benchmark Results"
            echo
            echo "Configuration: msvc, native/AADet backend."
            echo "Discovered ${#benchmarks[@]} benchmark(s) via CTest label 'benchmark'."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          benchmark_failure=0
          for bench in "${benchmarks[@]}"; do
            echo "========== $bench =========="
            result_file="benchmark-results/${bench}.txt"
            if "./build/stage/Release-windows/bin/$bench.exe" > "$result_file" 2>&1; then
              status=0
            else
              status=$?
              benchmark_failure=1
            fi
            cat "$result_file"
            echo

            {
              echo "### $bench"
              echo
              echo '```text'
              cat "$result_file"
              echo '```'
              if [ "$status" -ne 0 ]; then
                echo
                echo "Exit code: $status."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$benchmark_failure"
