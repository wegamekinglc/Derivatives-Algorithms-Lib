name: CMake Linux CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang-18, clang-19, gcc-13, gcc-14]
        aad-backend: [aadet, xad, codipack, adept]
        include:
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev libstdc++-14-dev
            coverage: false
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 libomp-19-dev libstdc++-14-dev
            coverage: false
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
            coverage: true
            gcov: gcov-13
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14
            coverage: true
            gcov: gcov-14

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y ${{ matrix.packages }} \
            libc++-dev make cmake libpython3-dev \
            autotools-dev autoconf libtool lcov

      - name: Setup coverage
        if: matrix.coverage
        run: |
          sudo ln -sf /usr/bin/${{ matrix.gcov }} /usr/bin/gcov

      - name: Configure AAD backend
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COVERAGE_FLAG=""
          if ${{ matrix.coverage }}; then
            COVERAGE_FLAG="--coverage"
          fi
          bash -e ./build_linux.sh $COVERAGE_FLAG

      - name: Coverage
        if: matrix.coverage
        run: |
          mkdir -p coverage
          if [ -f coverage_filtered.info ]; then
            cp coverage_filtered.info coverage/lcov.info
          elif [ -f coverage.info ]; then
            cp coverage.info coverage/lcov.info
          fi
          if [ -f coverage/lcov.info ]; then
            lcov --list coverage/lcov.info --ignore-errors empty
          fi

      - name: Coveralls
        if: matrix.coverage && matrix.compiler == 'gcc-14' && matrix.aad-backend == 'aadet'
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Extended build: dal-cpp + dal-public + dal-python.
  # Lives in a separate job so the main 16-job compiler×backend matrix
  # stays lean — the Python bindings are backend-agnostic, so testing
  # them against one representative configuration is sufficient.
  build-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 \
            libc++-dev make cmake \
            autotools-dev autoconf libtool

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # @v3

      - name: Set up Python venv
        run: |
          uv venv dal-python/.venv --python 3.12
          echo "$PWD/dal-python/.venv/bin" >> "$GITHUB_PATH"
          uv pip install pytest numpy

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: gcc-14
          CXX: g++-14
          VERBOSE: 1
          ADDITIONAL_CMAKE_FLAGS: -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off -DDAL_BUILD_PYTHON=ON
        run: |
          bash -e ./build_linux.sh
