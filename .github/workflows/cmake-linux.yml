name: CMake Linux CI
on: [push, pull_request]

# Per-ref grouping: a new push cancels stale runs of the same ref only --
# distinct PRs (refs/pull/N/merge) never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang-18, clang-19, gcc-13, gcc-14]
        aad-backend: [aadet, xad, codipack, adept]
        include:
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev libstdc++-14-dev
            coverage: false
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 libomp-19-dev libstdc++-14-dev
            coverage: false
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
            coverage: true
            gcov: gcov-13
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14
            coverage: true
            gcov: gcov-14

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      # The action's key gets only a "ccache-" prefix and a trailing
      # timestamp, so the key itself must carry every matrix dimension
      # (OS, compiler, backend) to keep the 16 jobs from colliding.
      # Coverage legs are excluded: cache hits skip compilation, and the
      # .gcno notes gcov needs are only emitted when the compiler runs.
      - name: Setup ccache
        if: matrix.coverage == false
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.aad-backend }}

      - name: Enable ccache launcher
        if: matrix.coverage == false
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Setup
        run: |
          sudo apt install -y ${{ matrix.packages }} \
            libc++-dev make cmake libpython3-dev \
            autotools-dev autoconf libtool lcov

      - name: Setup coverage
        if: matrix.coverage
        run: |
          sudo ln -sf /usr/bin/${{ matrix.gcov }} /usr/bin/gcov

      - name: Configure AAD backend
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          # Python bindings are backend-agnostic — tested separately in
          # the build-extended job so the 16-job matrix stays lean.
          FLAGS="$FLAGS -DDAL_BUILD_PYTHON=OFF"
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COVERAGE_FLAG=""
          if ${{ matrix.coverage }}; then
            COVERAGE_FLAG="--coverage"
          fi
          bash -e ./build_linux.sh $COVERAGE_FLAG

      - name: Test installed CMake consumer
        if: matrix.coverage == false
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          consumer_build="$RUNNER_TEMP/dal-consumer-${{ matrix.compiler }}-${{ matrix.aad-backend }}"
          cmake \
            -DDAL_INSTALL_PREFIX="$PWD/build/stage/Release-linux" \
            -DDAL_CONSUMER_BINARY_DIR="$consumer_build" \
            -DDAL_BUILD_CONFIG=Release \
            -P tests/installed-consumer/run.cmake

      - name: Coverage
        if: matrix.coverage
        run: |
          mkdir -p coverage
          if [ -f coverage_filtered.info ]; then
            cp coverage_filtered.info coverage/lcov.info
          elif [ -f coverage.info ]; then
            cp coverage.info coverage/lcov.info
          fi
          if [ -f coverage/lcov.info ]; then
            lcov --list coverage/lcov.info --ignore-errors empty
          fi

      - name: Coveralls
        if: matrix.coverage && matrix.compiler == 'gcc-14' && matrix.aad-backend == 'aadet'
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Extended build: dal-cpp + dal-public + dal-python.
  # Lives in a separate job so the main 16-job compiler×backend matrix
  # stays lean — the Python bindings are backend-agnostic, so testing
  # them against one representative configuration is sufficient.
  build-extended:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-extended

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 \
            libc++-dev make cmake \
            autotools-dev autoconf libtool

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # @v8.3.2

      - name: Set up Python venv
        run: |
          export VIRTUAL_ENV="$PWD/dal-python/.venv"
          uv venv "$VIRTUAL_ENV" --python 3.13
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          uv pip install pytest numpy

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: gcc-14
          CXX: g++-14
          VERBOSE: 1
          ADDITIONAL_CMAKE_FLAGS: -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off -DDAL_BUILD_PYTHON=ON
        run: |
          bash -e ./build_linux.sh

      - name: Verify generated sources
        run: |
          cmake --build build/Release-linux --target dal_check_generated --parallel 2

      - name: Test native DAL web gateway
        env:
          DAL_NUM_THREADS: 2
          PYTHONPATH: ${{ github.workspace }}/build/stage/Release-linux:${{ github.workspace }}/dal-web/backend
        run: |
          python .github/scripts/check_native_web_gateway.py

  # Web product surfaces are backend-agnostic except for the native gateway
  # smoke test above. Keep their dependency setup and browser run together so
  # npm/uv environments are created only once.
  web-quality:
    name: Web backend, frontend, and browser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # @v8.3.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # @v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dal-web/frontend/package-lock.json

      - name: Test and lint backend
        working-directory: dal-web/backend
        run: |
          uv sync --locked --inexact
          uv run --no-sync pytest
          uv run --no-sync ruff check .

      - name: Install and build frontend
        working-directory: dal-web/frontend
        run: |
          npm ci
          npm run build

      - name: Run frontend unit tests
        working-directory: dal-web/frontend
        run: |
          npm test

      - name: Prepare Chrome
        run: |
          ./dal-web/scripts/setup-playwright.sh

      - name: Run browser smoke tests
        env:
          DAL_PLAYWRIGHT_TEST_BACKEND: 1
        working-directory: dal-web/frontend
        run: |
          npm run test:e2e

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Check links, anchors, tables, metadata, and commands
        run: |
          python3 .github/scripts/check_docs.py

  warning-clean:
    name: Warning-clean GCC build
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-warning-clean

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake

      - name: Compile DAL with warnings as errors
        env:
          CC: gcc-14
          CXX: g++-14
          # These categories are existing DAL interface/generated-code debt.
          # All other warnings enabled by Wall/Wextra/Wpedantic are errors.
          CXXFLAGS: >-
            -Wall -Wextra -Wpedantic -Werror
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare
            -Wno-dangling-else -Wno-reorder -Wno-switch
            -Wno-missing-field-initializers -Wno-parentheses
            -Wno-unused-variable -Wno-redundant-move -Wno-pessimizing-move
            -Wno-sequence-point -Wno-implicit-fallthrough
        run: |
          build_dir="$RUNNER_TEMP/dal-warning-clean"
          cmake -S . -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=OFF \
            -DDAL_PUBLIC_BUILD_TESTS=OFF \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF
          cmake --build "$build_dir" --target dal_cpp dal_public --parallel 2

  sanitizers:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ASan + UBSan focused tests
            slug: asan-ubsan
            sanitizers: address;undefined
            flags: -O2 -g -fno-sanitize-recover=all
            core-filter: ConcurrencyTest.*:DistributionTest.*:MatrixTest.TestLowerBandAccumulator:StackTest.*:UnderdeterminedTest.TestFindUsesQuadraticBacktrackMinimum:ScriptTest.Test*Batch*:StorageTest.TestEvaluationDate*
            public-filter: PublicApiTest.TestMonteCarlo*
          - label: TSan concurrency tests
            slug: tsan
            sanitizers: thread
            flags: -O2 -g
            core-filter: ConcurrencyTest.TestConcurrentQueuePushAndPop:ConcurrencyTest.TestThreadPoolStartsLazily:ConcurrencyTest.TestThreadPoolStartStopLifecycle:ConcurrencyTest.TestThreadPoolUsesEnvironmentLimit:ConcurrencyTest.TestThreadPoolTaskCannotStopOrRestartPool:ConcurrencyTest.TestThreadPoolStopDrainsClaimedCallerAndCancelsQueuedTasks:StorageTest.TestEvaluationDateScopeOwnsBarrierButAllowsConcurrentRead:StorageTest.TestEvaluationDateWorkersObserveOneStableDateWhileSetterWaits:ScriptTest.TestSimulationTaskGroupDrainsOnSubmissionFailureAndPoolRecovers:ScriptTest.TestAadSimulationPropagatesTaskFailureAndRemainsUsable
            public-filter: ""

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-sanitizer-${{ matrix.slug }}

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake

      - name: Build instrumented tests
        env:
          CC: gcc-14
          CXX: g++-14
          CXXFLAGS: ${{ matrix.flags }}
          LDFLAGS: ${{ matrix.flags }}
        run: |
          build_dir="$RUNNER_TEMP/dal-${{ matrix.slug }}"
          cmake -S . -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDAL_ENABLE_SANITIZERS='${{ matrix.sanitizers }}' \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_CPP_BUILD_TESTS=ON \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=OFF \
            -DDAL_PUBLIC_BUILD_TESTS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF
          targets=(dal_cpp_tests)
          if [ -n '${{ matrix.public-filter }}' ]; then
            targets+=(dal_public_tests)
          fi
          cmake --build "$build_dir" --target "${targets[@]}" --parallel 2
          echo "SANITIZER_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Run focused core tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          DAL_NUM_THREADS: 4
        run: |
          "$SANITIZER_BUILD_DIR/dal-cpp/dal_cpp_tests" \
            --gtest_filter='${{ matrix.core-filter }}'

      - name: Run focused public tests
        if: matrix.public-filter != ''
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          DAL_NUM_THREADS: 4
        run: |
          "$SANITIZER_BUILD_DIR/dal-public/dal_public_tests" \
            --gtest_filter='${{ matrix.public-filter }}'

  # Benchmark job: builds pull-request base and head on the same runner, then
  # interleaves repeated runs so host noise affects both sides comparably.
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    # No ccache here: this job builds with -march=native, and cached objects
    # restored on a different runner CPU generation crash with SIGILL.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake \
            libc++-dev autotools-dev autoconf libtool

      - name: Test benchmark regression gate
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v

      - name: Build head benchmarks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/benchmark-head \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build build/benchmark-head --parallel

      - name: Build base benchmarks
        if: github.event_name == 'pull_request'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S benchmark-base -B benchmark-base/build/benchmark-base \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build benchmark-base/build/benchmark-base --parallel

      - name: Run head benchmarks
        env:
          DAL_NUM_THREADS: 4
        run: |
          # Single-source benchmark list via CTest labels (H8 fix)
          # ctest -N right-justifies the test-number field ("  Test  #1:" .. "  Test #10:"), so tolerate the padding
          benchmarks=( $(ctest -N -L benchmark --test-dir build/benchmark-head | awk -F': ' '/Test +#/{print $2}') )
          if [ ${#benchmarks[@]} -eq 0 ]; then
            echo "benchmark discovery failed: ctest -N -L benchmark --test-dir build/benchmark-head found no tests"
            exit 1
          fi

          mkdir -p benchmark-results
          {
            echo "## Benchmark Results"
            echo
            echo "Configuration: gcc-14, native CPU tuning, AADet backend, Release."
            echo "Discovered ${#benchmarks[@]} benchmark(s) via CTest label 'benchmark'."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          benchmark_failure=0
          for bench in "${benchmarks[@]}"; do
            echo "========== $bench =========="
            result_file="benchmark-results/${bench}.txt"
            if "./build/benchmark-head/dal-cpp/benchmarks/$bench/$bench" > "$result_file" 2>&1; then
              status=0
            else
              status=$?
              benchmark_failure=1
            fi
            cat "$result_file"
            echo

            {
              echo "### $bench"
              echo
              echo '```text'
              cat "$result_file"
              echo '```'
              if [ "$status" -ne 0 ]; then
                echo
                echo "Exit code: $status."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          exit "$benchmark_failure"

      - name: Compare base and head performance
        if: github.event_name == 'pull_request'
        env:
          DAL_NUM_THREADS: 4
        run: |
          python3 .github/scripts/check_benchmark_regressions.py \
            --base-root benchmark-base/build/benchmark-base \
            --head-root build/benchmark-head \
            --output-dir benchmark-results/paired \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 \
            --confirmation-rounds 2 \
            --threshold-percent 4
