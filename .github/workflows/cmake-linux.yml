name: CMake Linux CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang-18, clang-19, gcc-13, gcc-14]
        aad-backend: [aadet, xad, codipack, adept]
        include:
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev libstdc++-14-dev
            coverage: false
          - compiler: clang-19
            cc: clang-19
            cxx: clang++-19
            packages: clang-19 libomp-19-dev libstdc++-14-dev
            coverage: false
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
            coverage: true
            gcov: gcov-13
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14
            coverage: true
            gcov: gcov-14

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y ${{ matrix.packages }} \
            libc++-dev make cmake libpython3-dev \
            autotools-dev autoconf libtool lcov

      - name: Setup coverage
        if: matrix.coverage
        run: |
          sudo ln -sf /usr/bin/${{ matrix.gcov }} /usr/bin/gcov

      - name: Configure AAD backend
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          # Python bindings are backend-agnostic — tested separately in
          # the build-extended job so the 16-job matrix stays lean.
          FLAGS="$FLAGS -DDAL_BUILD_PYTHON=OFF"
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COVERAGE_FLAG=""
          if ${{ matrix.coverage }}; then
            COVERAGE_FLAG="--coverage"
          fi
          bash -e ./build_linux.sh $COVERAGE_FLAG

      - name: Test installed CMake consumer
        if: matrix.coverage == false
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          consumer_build="$RUNNER_TEMP/dal-consumer-${{ matrix.compiler }}-${{ matrix.aad-backend }}"
          cmake \
            -DDAL_INSTALL_PREFIX="$PWD/build/stage/Release-linux" \
            -DDAL_CONSUMER_BINARY_DIR="$consumer_build" \
            -DDAL_BUILD_CONFIG=Release \
            -P tests/installed-consumer/run.cmake

      - name: Coverage
        if: matrix.coverage
        run: |
          mkdir -p coverage
          if [ -f coverage_filtered.info ]; then
            cp coverage_filtered.info coverage/lcov.info
          elif [ -f coverage.info ]; then
            cp coverage.info coverage/lcov.info
          fi
          if [ -f coverage/lcov.info ]; then
            lcov --list coverage/lcov.info --ignore-errors empty
          fi

      - name: Coveralls
        if: matrix.coverage && matrix.compiler == 'gcc-14' && matrix.aad-backend == 'aadet'
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Extended build: dal-cpp + dal-public + dal-python.
  # Lives in a separate job so the main 16-job compiler×backend matrix
  # stays lean — the Python bindings are backend-agnostic, so testing
  # them against one representative configuration is sufficient.
  build-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 \
            libc++-dev make cmake \
            autotools-dev autoconf libtool

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # @v8.2.0

      - name: Set up Python venv
        run: |
          export VIRTUAL_ENV="$PWD/dal-python/.venv"
          uv venv "$VIRTUAL_ENV" --python 3.12
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          uv pip install pytest numpy

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: gcc-14
          CXX: g++-14
          VERBOSE: 1
          ADDITIONAL_CMAKE_FLAGS: -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off -DDAL_BUILD_PYTHON=ON
        run: |
          bash -e ./build_linux.sh

  # Benchmark job: builds and runs all performance benchmarks on one
  # representative configuration (gcc-14, native/AADet backend, -O3).
  # Results appear in the CI logs and job summary; timings are not a pass/fail gate.
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake \
            libc++-dev autotools-dev autoconf libtool

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
          CXXFLAGS: -O3
          ADDITIONAL_CMAKE_FLAGS: -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off -DDAL_BUILD_PYTHON=OFF
        run: |
          bash -e ./build_linux.sh --benchmarks

      - name: Run benchmarks
        run: |
          benchmarks=(
            matrix_perf
            script_perf
            tape_perf
            jacobian_perf
            pde_perf
            rng_perf
            interp_perf
            krylov_perf
            banded_perf
            cholesky_perf
            specialfunctions_perf
            black_perf
            iv_brent_perf
            script_mc_perf
            curve_calibration_perf
          )

          mkdir -p benchmark-results
          {
            echo "## Benchmark Results"
            echo
            echo "Configuration: gcc-14, native/AADet backend, -O3."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for bench in "${benchmarks[@]}"; do
            echo "========== $bench =========="
            result_file="benchmark-results/${bench}.txt"
            if "./build/stage/Release-linux/bin/$bench" > "$result_file" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$result_file"
            echo

            {
              echo "### $bench"
              echo
              echo '```text'
              cat "$result_file"
              echo '```'
              if [ "$status" -ne 0 ]; then
                echo
                echo "Exit code: $status (not fail-gated)."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
