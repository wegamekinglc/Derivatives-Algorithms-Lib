name: CMake Linux CI
on:
  pull_request:
  push:
    branches:
      - master

# Per-ref grouping: a new push cancels stale runs of the same ref only --
# distinct PRs (refs/pull/N/merge) never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 .github/scripts/classify_ci_changes.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  # The matrix is generated rather than declared inline for two reasons:
  #
  # 1. Push events (master merges or direct master pushes) run a lean subset --
  #    gcc-14 and clang-20 across all four AAD backends (8 legs) -- because
  #    pull requests already ran the full 6 x 4 matrix before merge. Pull
  #    requests still get every compiler x backend combination.
  # 2. Coverage is consolidated onto the single gcc-14/aadet leg, the only
  #    one Coveralls consumes. Every backend is still fully compiled and
  #    tested; the dropped legs only repeated gcov-instrumented builds whose
  #    lcov output nobody read.
  define-matrix:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        run: |
          python3 - "${{ github.event_name }}" <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          event = sys.argv[1]

          compilers = [
              {"compiler": "clang-18", "cc": "clang-18", "cxx": "clang++-18",
               "packages": "clang-18 libomp-18-dev libstdc++-14-dev"},
              {"compiler": "clang-19", "cc": "clang-19", "cxx": "clang++-19",
               "packages": "clang-19 libomp-19-dev libstdc++-14-dev"},
              {"compiler": "clang-20", "cc": "clang-20", "cxx": "clang++-20",
               "packages": "clang-20 libomp-20-dev libstdc++-14-dev"},
              {"compiler": "gcc-13", "cc": "gcc-13", "cxx": "g++-13",
               "packages": "gcc-13 g++-13"},
              {"compiler": "gcc-14", "cc": "gcc-14", "cxx": "g++-14",
               "packages": "gcc-14 g++-14"},
              # gcc-15 comes from ppa:ubuntu-toolchain-r/test, not the Ubuntu
              # 24.04 archive; the build job adds the PPA for this leg.
              {"compiler": "gcc-15", "cc": "gcc-15", "cxx": "g++-15",
               "packages": "gcc-15 g++-15"},
          ]
          backends = ["aadet", "xad", "codipack", "adept"]
          push_compilers = {"gcc-14", "clang-20"}

          include = []
          for entry in compilers:
              if event == "push" and entry["compiler"] not in push_compilers:
                  continue
              for backend in backends:
                  leg = dict(entry)
                  leg["aad-backend"] = backend
                  leg["coverage"] = (
                      entry["compiler"] == "gcc-14" and backend == "aadet")
                  if leg["coverage"]:
                      leg["gcov"] = "gcov-14"
                  include.append(leg)

          print(f"matrix={json.dumps({'include': include})}")
          PYEOF

  build:
    # Explicit name keeps the historical "build (<compiler>, <backend>)"
    # check names stable for branch protection and log searching.
    name: build (${{ matrix.compiler }}, ${{ matrix.aad-backend }})
    needs:
      - changes
      - define-matrix
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      # The action's key gets only a "ccache-" prefix and a trailing
      # timestamp, so the key itself must carry every matrix dimension
      # (OS, compiler, backend) to keep the matrix legs from colliding.
      # The coverage leg is excluded: cache hits skip compilation, and the
      # .gcno notes gcov needs are only emitted when the compiler runs.
      - name: Setup ccache
        if: matrix.coverage == false
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.aad-backend }}

      - name: Enable ccache launcher
        if: matrix.coverage == false
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      # gcc-15 is not in the Ubuntu 24.04 archive; the toolchain test PPA
      # publishes it for noble. add-apt-repository refreshes the apt lists.
      # The Launchpad lookup and apt refresh are transient-prone (seen on
      # PR #299: two gcc-15 legs failed in this step within minutes while the
      # other two succeeded), so retry with backoff before giving up.
      - name: Add gcc-15 toolchain PPA
        if: matrix.compiler == 'gcc-15'
        run: |
          for attempt in 1 2 3 4; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
              exit 0
            fi
            echo "PPA setup failed (attempt $attempt of 4); retrying after backoff"
            sleep $((attempt * 20))
          done
          echo "PPA setup failed after 4 attempts"
          exit 1

      - name: Setup
        run: |
          sudo apt install -y ${{ matrix.packages }} \
            libc++-dev make cmake libpython3-dev \
            autotools-dev autoconf libtool lcov

      - name: Setup coverage
        if: matrix.coverage
        run: |
          sudo ln -sf /usr/bin/${{ matrix.gcov }} /usr/bin/gcov

      - name: Configure AAD backend
        run: |
          case "${{ matrix.aad-backend }}" in
            aadet)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            xad)
              FLAGS="-DDAL_USE_XAD_AAD=on -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off" ;;
            codipack)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=on -DDAL_USE_ADEPT_AAD=off" ;;
            adept)
              FLAGS="-DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=on" ;;
          esac
          # Python bindings are backend-agnostic — tested separately in
          # the build-extended job so the matrix stays lean.
          FLAGS="$FLAGS -DDAL_BUILD_PYTHON=OFF"
          echo "ADDITIONAL_CMAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          COVERAGE_FLAG=""
          if ${{ matrix.coverage }}; then
            COVERAGE_FLAG="--coverage"
          fi
          bash -e ./build_linux.sh $COVERAGE_FLAG

      - name: Test installed CMake consumer
        if: matrix.coverage == false
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          consumer_build="$RUNNER_TEMP/dal-consumer-${{ matrix.compiler }}-${{ matrix.aad-backend }}"
          cmake \
            -DDAL_INSTALL_PREFIX="$PWD/build/stage/Release-linux" \
            -DDAL_CONSUMER_BINARY_DIR="$consumer_build" \
            -DDAL_BUILD_CONFIG=Release \
            -P tests/installed-consumer/run.cmake

      - name: Coverage
        if: matrix.coverage
        run: |
          mkdir -p coverage
          if [ -f coverage_filtered.info ]; then
            cp coverage_filtered.info coverage/lcov.info
          elif [ -f coverage.info ]; then
            cp coverage.info coverage/lcov.info
          fi
          if [ -f coverage/lcov.info ]; then
            lcov --list coverage/lcov.info --ignore-errors empty
          fi

      # Only one leg carries coverage (gcc-14/aadet) — see define-matrix.
      - name: Coveralls
        if: matrix.coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  codipack-thread-isolation:
    name: CoDiPack thread isolation
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
      CXXFLAGS: -O2
      DAL_NUM_THREADS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake

      - name: Configure CoDiPack
        run: |
          cmake --preset=Release-linux -S . -B build/Release-codipack \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=ON \
            -DDAL_USE_ADEPT_AAD=OFF \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=OFF

      - name: Build CoDiPack
        run: |
          cmake --build build/Release-codipack --parallel "$(nproc)"

      - name: Test CoDiPack thread isolation
        run: |
          ./build/Release-codipack/dal-cpp/dal_cpp_tests \
            --gtest_filter='AADTest.TestCoDiPackTapeIsPerThreadAcrossThreadLifetimes:AADTest.TestWithCheckpointWithMultiThreading:AADTest.TestAADMutiThread'

      - name: Test CoDiPack suite
        run: |
          ctest --test-dir build/Release-codipack --output-on-failure --parallel "$(nproc)" -LE benchmark

  # Extended build: dal-cpp + dal-public + dal-python.
  # Lives in a separate job so the main compiler×backend matrix stays
  # lean — the Python bindings are backend-agnostic, so testing them
  # against one representative configuration is sufficient.
  build-extended:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-extended

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 \
            libc++-dev make cmake \
            autotools-dev autoconf libtool

      # Python env: uv-managed venv, matching the convention in
      # dal-python/run_tests.sh. The venv must be on PATH *before* the
      # Configure step so cmake's find_package(Python3) picks up the
      # venv's interpreter — otherwise dal_python_pytest runs against
      # the system python, which doesn't have pytest.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # @v10.0.1

      - name: Set up Python venv
        run: |
          export VIRTUAL_ENV="$PWD/dal-python/.venv"
          uv venv "$VIRTUAL_ENV" --python 3.13
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          uv pip install pytest numpy

      - name: Compile and test
        env:
          CXXFLAGS: -O2
          CC: gcc-14
          CXX: g++-14
          VERBOSE: 1
          ADDITIONAL_CMAKE_FLAGS: -DDAL_USE_XAD_AAD=off -DDAL_USE_CODIPACK_AAD=off -DDAL_USE_ADEPT_AAD=off -DDAL_BUILD_PYTHON=ON
        run: |
          bash -e ./build_linux.sh

      - name: Verify generated sources
        run: |
          cmake --build build/Release-linux --target dal_check_generated --parallel "$(nproc)"

      - name: Preserve quote-risk oracle evidence
        env:
          DAL_QUOTE_RISK_EVIDENCE_FILE: ${{ github.workspace }}/quote-risk-oracle-evidence.csv
        run: |
          ./build/Release-linux/dal-cpp/dal_cpp_tests \
            --gtest_filter='QuoteRiskAggregationTest.TestFullRecalibrationOracleAtRequiredWidthsAndModes:QuoteRiskAggregationTest.TestXccyFullRecalibrationOracleAtRequiredWidthsAndModes'
          # Expected rows: 1 header + 496 evidence rows =
          #   (5 + 10 + 16) quotes x 2 Jacobian modes x
          #   (4 single-curve parameterizations + 2 XCCY domains x 2 currency portfolios).
          # Keep in sync with the two oracle tests filtered above.
          expected_rows=$((1 + (5 + 10 + 16) * 2 * (4 + 2 * 2)))
          awk -F, -v expected="$expected_rows" 'NF != 21 { exit 1 } END { if (NR != expected) exit 1 }' "$DAL_QUOTE_RISK_EVIDENCE_FILE"

      - name: Upload quote-risk oracle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quote-risk-oracle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: quote-risk-oracle-evidence.csv
          if-no-files-found: ignore
          retention-days: 30

  documentation:
    name: Documentation integrity
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check links, anchors, tables, metadata, and commands
        run: |
          python3 .github/scripts/check_docs.py

  warning-clean:
    name: Warning-clean GCC build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-warning-clean

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake

      - name: Compile DAL with warnings as errors
        env:
          CC: gcc-14
          CXX: g++-14
          # These categories are existing DAL interface/generated-code debt.
          # All other warnings enabled by Wall/Wextra/Wpedantic are errors.
          CXXFLAGS: >-
            -Wall -Wextra -Wpedantic -Werror
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare
            -Wno-dangling-else -Wno-reorder -Wno-switch
            -Wno-missing-field-initializers -Wno-parentheses
            -Wno-unused-variable -Wno-redundant-move -Wno-pessimizing-move
            -Wno-sequence-point -Wno-implicit-fallthrough
        run: |
          build_dir="$RUNNER_TEMP/dal-warning-clean"
          cmake -S . -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=OFF \
            -DDAL_PUBLIC_BUILD_TESTS=OFF \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF
          cmake --build "$build_dir" --target dal_cpp dal_public --parallel "$(nproc)"

  sanitizers:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ASan + UBSan focused tests
            slug: asan-ubsan
            sanitizers: address;undefined
            flags: -O2 -g -fno-sanitize-recover=all
            core-filter: ConcurrencyTest.*:DistributionTest.*:MatrixTest.TestLowerBandAccumulator:ModelTest.TestBlackScholesModelCloneHasDefinedPreAllocationState:StackTest.*:UnderdeterminedTest.TestFindUsesQuadraticBacktrackMinimum:ScriptTest.Test*Batch*:ScriptTest.TestParse*:StorageTest.TestEvaluationDate*:RateCashflowPricingTest.TestRegistryAndDepositCashflows
            public-filter: PublicApiTest.TestMonteCarlo*:CurvePricingPublicTest.TestClosedRegistryAndStructuredTerms
          - label: TSan concurrency tests
            slug: tsan
            sanitizers: thread
            flags: -O2 -g
            core-filter: ConcurrencyTest.TestConcurrentQueuePushAndPop:ConcurrencyTest.TestThreadPoolStartsLazily:ConcurrencyTest.TestThreadPoolStartStopLifecycle:ConcurrencyTest.TestThreadPoolUsesEnvironmentLimit:ConcurrencyTest.TestThreadPoolTaskCannotStopOrRestartPool:ConcurrencyTest.TestThreadPoolStopDrainsClaimedCallerAndCancelsQueuedTasks:StorageTest.TestEvaluationDateScopeOwnsBarrierButAllowsConcurrentRead:StorageTest.TestEvaluationDateWorkersObserveOneStableDateWhileSetterWaits:ScriptTest.TestSimulationTaskGroupDrainsOnSubmissionFailureAndPoolRecovers:ScriptTest.TestAadSimulationPropagatesTaskFailureAndRemainsUsable:RateCashflowPricingTest.TestNodeSensitivityTapeObservationIsScopedAndConcurrent
            public-filter: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # @v1.2.23
        with:
          key: ${{ runner.os }}-sanitizer-${{ matrix.slug }}

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake

      - name: Build instrumented tests
        env:
          CC: gcc-14
          CXX: g++-14
          CXXFLAGS: ${{ matrix.flags }}
          LDFLAGS: ${{ matrix.flags }}
        run: |
          build_dir="$RUNNER_TEMP/dal-${{ matrix.slug }}"
          cmake -S . -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDAL_ENABLE_SANITIZERS='${{ matrix.sanitizers }}' \
            -DDAL_BUILD_PUBLIC=ON \
            -DDAL_CPP_BUILD_TESTS=ON \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=OFF \
            -DDAL_PUBLIC_BUILD_TESTS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF
          targets=(dal_cpp_tests)
          if [ -n '${{ matrix.public-filter }}' ]; then
            targets+=(dal_public_tests)
          fi
          cmake --build "$build_dir" --target "${targets[@]}" --parallel "$(nproc)"
          echo "SANITIZER_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Run focused core tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          DAL_NUM_THREADS: 4
        run: |
          "$SANITIZER_BUILD_DIR/dal-cpp/dal_cpp_tests" \
            --gtest_filter='${{ matrix.core-filter }}'

      - name: Run focused public tests
        if: matrix.public-filter != ''
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          DAL_NUM_THREADS: 4
        run: |
          "$SANITIZER_BUILD_DIR/dal-public/dal_public_tests" \
            --gtest_filter='${{ matrix.public-filter }}'

  # Benchmark job: builds pull-request base and head on the same runner, then
  # interleaves repeated runs so host noise affects both sides comparably.
  benchmark:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # No ccache here: this job builds with -march=native, and cached objects
    # restored on a different runner CPU generation crash with SIGILL.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          # Depth 2 keeps HEAD~1 available: the base-SHA fallback for a branch's
          # first push (all-zero github.event.before) resolves to the head's parent.
          fetch-depth: 2

      - name: Resolve benchmark base SHA
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-$EVENT_BEFORE}"
          # A branch's first push reports an all-zero 'before'; fall back to the head's
          # first parent so the paired gate still has a baseline to compare against.
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD~1)"
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: benchmark-base
          submodules: recursive

      - name: Setup
        run: |
          sudo apt install -y gcc-14 g++-14 make cmake time \
            libc++-dev autotools-dev autoconf libtool

      - name: Capture benchmark environment
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
        run: |
          resolved_base="$BASE_SHA"
          if [ -d benchmark-base ]; then
            resolved_base="$(git -C benchmark-base rev-parse HEAD)"
          fi
          python3 .github/scripts/write_benchmark_metadata.py \
            --output benchmark-results/environment.json \
            --head-sha "$(git rev-parse HEAD)" \
            --base-sha "$resolved_base" \
            --compiler gcc-14 \
            --aad-backend aadet \
            --threads 4 \
            --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}"

      - name: Test benchmark regression gate
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v

      - name: Build head benchmarks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/benchmark-head \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build build/benchmark-head --parallel

      - name: Build base benchmarks
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S benchmark-base -B benchmark-base/build/benchmark-base \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAL_BUILD_PUBLIC=OFF \
            -DDAL_CPP_BUILD_TESTS=OFF \
            -DDAL_CPP_BUILD_EXAMPLES=OFF \
            -DDAL_CPP_BUILD_BENCHMARKS=ON \
            -DDAL_BUILD_PYTHON=OFF \
            -DDAL_USE_XAD_AAD=OFF \
            -DDAL_USE_CODIPACK_AAD=OFF \
            -DDAL_USE_ADEPT_AAD=OFF \
            -DDAL_ENABLE_NATIVE_ARCH=ON
          cmake --build benchmark-base/build/benchmark-base --parallel

      - name: Run head benchmarks
        env:
          DAL_NUM_THREADS: 4
        run: |
          # Single-source benchmark list via CTest labels (H8 fix)
          # ctest -N right-justifies the test-number field ("  Test  #1:" .. "  Test #10:"), so tolerate the padding
          benchmarks=( $(ctest -N -L benchmark --test-dir build/benchmark-head | awk -F': ' '/Test +#/{print $2}') )
          if [ ${#benchmarks[@]} -eq 0 ]; then
            echo "benchmark discovery failed: ctest -N -L benchmark --test-dir build/benchmark-head found no tests"
            exit 1
          fi

          mkdir -p benchmark-results
          benchmark_failure=0
          for bench in "${benchmarks[@]}"; do
            echo "========== $bench =========="
            result_file="benchmark-results/${bench}.txt"
            resource_file="benchmark-results/${bench}.resources.txt"
            if /usr/bin/time --verbose --output="$resource_file" \
              "./build/benchmark-head/dal-cpp/benchmarks/$bench/$bench" > "$result_file" 2>&1; then
              status=0
            else
              status=$?
              benchmark_failure=1
            fi
            echo "$status" > "benchmark-results/${bench}.status"
            cat "$result_file"
            echo
          done

          # One aggregated table for the whole run, replacing the old per-benchmark
          # summary sections that each repeated their own header.
          python3 .github/scripts/write_benchmark_summary.py \
            --results-dir benchmark-results \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --configuration "gcc-14, native CPU tuning, AADet backend, Release." \
            --benchmarks "${benchmarks[@]}"

          exit "$benchmark_failure"

      - name: Compare base and head performance
        env:
          DAL_NUM_THREADS: 4
        run: |
          python3 .github/scripts/check_benchmark_regressions.py \
            --base-root benchmark-base/build/benchmark-base \
            --head-root build/benchmark-head \
            --output-dir benchmark-results/paired \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --samples 10 \
            --confirmation-rounds 2 \
            --threshold-percent 4

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 30

  linux-gate:
    name: Linux CI gate
    if: always()
    needs:
      - changes
      - documentation
      - define-matrix
      - build
      - codipack-thread-isolation
      - build-extended
      - warning-clean
      - sanitizers
      - benchmark
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_RESULT: ${{ needs.documentation.result }}
      MATRIX_RESULT: ${{ needs.define-matrix.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      CODIPACK_RESULT: ${{ needs.codipack-thread-isolation.result }}
      EXTENDED_RESULT: ${{ needs.build-extended.result }}
      WARNING_RESULT: ${{ needs.warning-clean.result }}
      SANITIZER_RESULT: ${{ needs.sanitizers.result }}
      BENCHMARK_RESULT: ${{ needs.benchmark.result }}
    steps:
      - name: Require the selected CI path to pass
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            exit 0
          fi
          for result in \
            "$MATRIX_RESULT" \
            "$BUILD_RESULT" \
            "$CODIPACK_RESULT" \
            "$EXTENDED_RESULT" \
            "$WARNING_RESULT" \
            "$SANITIZER_RESULT" \
            "$BENCHMARK_RESULT"; do
            test "$result" = success
          done
