name: dal-python wheels and PyPI release

on:
  pull_request:
    paths:
      - .github/scripts/check_docs.py
      - .github/workflows/dal-python-release.yml
      - dal-python/**
      - CMakeLists.txt
      - CMakePresets.json
      - dal-cpp/**
      - dal-public/**
  push:
    tags:
      - dal-python-v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python compatibility runner
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # @v9.0.0

      - name: Check Python 3.9 syntax compatibility
        run: >-
          uv run --isolated --no-project --python 3.9 python
          .github/scripts/check_dal_python_syntax.py

      - name: Validate version and tag policy
        shell: bash
        run: |
          args=(--version-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags origin master
            test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
            test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python dal-python/scripts/verify_release.py "${args[@]}"

  wheels:
    name: ${{ matrix.platform }} wheels
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          package-dir: dal-python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp39-* cp313-*' || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}

      - name: Set up Python 3.9 smoke interpreter
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # @v9.0.0

      - name: Smoke test installed Python 3.9 wheel
        run: >-
          uv run --isolated --no-project --python 3.9 python
          dal-python/scripts/smoke_installed_wheel.py
          --wheelhouse "${{ github.workspace }}/wheelhouse"
          --environment "${{ runner.temp }}/dal-python-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
          --work-dir "${{ runner.temp }}/dal-python-smoke-work-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
          --exclude "${{ github.workspace }}"
          --exclude "${{ github.workspace }}/wheelhouse"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify:
    name: Verify release manifest
    needs: wheels
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PYTHON: ${{ github.event_name == 'pull_request' && 'cp39,cp313' || 'cp39,cp310,cp311,cp312,cp313' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Validate wheel matrix and metadata
        shell: bash
        run: |
          args=(
            --dist-dir wheelhouse
            --expected-python "${EXPECTED_PYTHON}"
          )
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python dal-python/scripts/verify_release.py "${args[@]}" \
            | tee release-manifest.txt

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dal-python-release-manifest
          path: release-manifest.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish wheels to PyPI
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dal-python/
    permissions:
      id-token: write

    steps:
      - name: Download verified wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Publish exact wheel artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: wheelhouse
