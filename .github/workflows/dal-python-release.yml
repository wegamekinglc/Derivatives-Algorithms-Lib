name: dal-python wheels and PyPI release

on:
  push:
    tags:
      - dal-python-v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check tag provenance and version
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          git fetch --no-tags origin master
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          python dal-python/scripts/verify_release.py \
            --version-only --tag "${GITHUB_REF_NAME}" --check-pypi

  wheels:
    name: ${{ matrix.platform }} wheels
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-amd64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Build and test wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: dal-python
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish wheels to PyPI
    needs: [prepare, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dal-python/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Validate release tag and wheels
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          python dal-python/scripts/verify_release.py \
            --dist-dir wheelhouse --tag "${GITHUB_REF_NAME}" --check-pypi

      - name: Publish exact wheel artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: wheelhouse
