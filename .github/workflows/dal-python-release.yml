name: dal-python wheels and PyPI release

on:
  push:
    tags:
      - dal-python-v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check tag provenance and version
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          git fetch --no-tags origin master
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          python dal-python/scripts/verify_release.py \
            --version-only --tag "${GITHUB_REF_NAME}" --check-pypi

  wheels:
    name: ${{ matrix.platform }} wheels
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-amd64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out pinned dependencies
        run: python .github/scripts/checkout_dependencies.py

      - name: Build and test wheels
        uses: pypa/cibuildwheel@f11181315571b24e4a3c67f1a828532793f2df55 # v4.3.2
        with:
          package-dir: dal-python
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish wheels to PyPI
    needs: [prepare, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dal-python/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: Validate release tag and wheels
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          python dal-python/scripts/verify_release.py \
            --dist-dir wheelhouse --tag "${GITHUB_REF_NAME}" --check-pypi

      - name: Publish exact wheel artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: wheelhouse
